<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="0;url=examples/image-tracking/brand-ar.html" />
    <title>Joel's AR Studio — WebAR Platform</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background: #0f172a;
        color: #f8fafc;
        font-family: 'Inter', sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .card {
        background: #1e293b;
        padding: 40px;
        border-radius: 24px;
        border: 1px solid #334155;
        max-width: 480px;
        width: 90%;
        box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      }
      h1 { font-size: 24px; margin-bottom: 12px; }
      p { color: #94a3b8; font-size: 14px; margin-bottom: 28px; }
      .btn {
        display: block;
        width: 100%;
        padding: 14px;
        margin-bottom: 12px;
        border-radius: 12px;
        background: #2563eb;
        color: #ffffff;
        text-decoration: none;
        font-weight: 700;
        font-size: 14px;
        transition: all 0.2s ease;
      }
      .btn:hover { background: #1d4ed8; }
      .btn-secondary { background: #334155; color: #f8fafc; }
      .btn-secondary:hover { background: #475569; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>⚡ Joel's AR Studio</h1>
      <p>Redirecting to WebAR Scanner App...</p>
      <a href="examples/image-tracking/brand-ar.html" class="btn">Launch WebAR Scanner</a>
      <a href="examples/image-tracking/admin.html" class="btn btn-secondary">Open Admin Dashboard</a>
      <a href="examples/image-tracking/compile.html" class="btn btn-secondary">Target Photo Compiler</a>
    </div>
  </body>
</html>
